<svg xmlns="http://www.w3.org/2000/svg" width="920" height="368" viewBox="0 0 920 368" role="img" aria-label="Selected open source projects" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif"><a href="https://github.com/awslew/screenshot-paste-assistant" target="_blank"><rect x="0.5" y="0.5" width="451" height="111" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="18" y="18" width="34" height="34" rx="8" fill="#0969DA" opacity="0.14"/><text x="35" y="40" font-size="13" font-weight="700" fill="#0969DA" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">SP</text><text x="64" y="33" font-size="15" font-weight="600" fill="#1F2328" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">screenshot-paste-assistant</text><text x="64" y="50" font-size="11.5" fill="#6E7781">Windows · 效率</text><text x="18" y="74" font-size="12.5" fill="#4A5560">Win+Shift+S 截图后 Ctrl+V 直接粘成图片文件，恢复缺失的 CF_HDROP。</text><circle cx="22" cy="98" r="4.5" fill="#3572A5"/><text x="33" y="102" font-size="11.5" fill="#6E7781">Python</text><text x="434" y="102" font-size="11.5" fill="#6E7781" text-anchor="end">★ 1</text></a><a href="https://github.com/awslew/web-search-mcp" target="_blank"><rect x="468.5" y="0.5" width="451" height="111" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="486" y="18" width="34" height="34" rx="8" fill="#0969DA" opacity="0.14"/><text x="503" y="40" font-size="13" font-weight="700" fill="#0969DA" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">WS</text><text x="532" y="33" font-size="15" font-weight="600" fill="#1F2328" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">web-search-mcp</text><text x="532" y="50" font-size="11.5" fill="#6E7781">MCP · 检索</text><text x="486" y="74" font-size="12.5" fill="#4A5560">免费多引擎联网检索 MCP：中文走国内引擎融合，英文走国际链，不用</text><text x="486" y="91" font-size="12.5" fill="#4A5560">API key。</text><circle cx="490" cy="98" r="4.5" fill="#F1E05A"/><text x="501" y="102" font-size="11.5" fill="#6E7781">JavaScript</text><text x="902" y="102" font-size="11.5" fill="#6E7781" text-anchor="end">★ 1</text></a><a href="https://github.com/awslew/continuity-orchestrator" target="_blank"><rect x="0.5" y="128.5" width="451" height="111" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="18" y="146" width="34" height="34" rx="8" fill="#0969DA" opacity="0.14"/><text x="35" y="168" font-size="13" font-weight="700" fill="#0969DA" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">CO</text><text x="64" y="161" font-size="15" font-weight="600" fill="#1F2328" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">continuity-orchestrator</text><text x="64" y="178" font-size="11.5" fill="#6E7781">MCP · 本地文件</text><text x="18" y="202" font-size="12.5" fill="#4A5560">让任意 MCP 客户端读取你明确共享的本地项目源码，真实路径与行号。</text><circle cx="22" cy="226" r="4.5" fill="#3178C6"/><text x="33" y="230" font-size="11.5" fill="#6E7781">TypeScript</text><text x="434" y="230" font-size="11.5" fill="#6E7781" text-anchor="end">★ 1</text></a><a href="https://github.com/awslew/lottery-one-pick" target="_blank"><rect x="468.5" y="128.5" width="451" height="111" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="486" y="146" width="34" height="34" rx="8" fill="#0969DA" opacity="0.14"/><text x="503" y="168" font-size="13" font-weight="700" fill="#0969DA" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">LP</text><text x="532" y="161" font-size="15" font-weight="600" fill="#1F2328" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">lottery-one-pick</text><text x="532" y="178" font-size="11.5" fill="#6E7781">Python · CLI</text><text x="486" y="202" font-size="12.5" fill="#4A5560">每期只出 1 注的大乐透选号工具：排除池随机加三关过筛。</text><circle cx="490" cy="226" r="4.5" fill="#3572A5"/><text x="501" y="230" font-size="11.5" fill="#6E7781">Python</text><text x="902" y="230" font-size="11.5" fill="#6E7781" text-anchor="end">★ 1</text></a><a href="https://github.com/awslew/codex-agent-chain" target="_blank"><rect x="0.5" y="256.5" width="451" height="111" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="18" y="274" width="34" height="34" rx="8" fill="#0969DA" opacity="0.14"/><text x="35" y="296" font-size="13" font-weight="700" fill="#0969DA" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">AC</text><text x="64" y="289" font-size="15" font-weight="600" fill="#1F2328" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">codex-agent-chain</text><text x="64" y="306" font-size="11.5" fill="#6E7781">MCP · 编排</text><text x="18" y="330" font-size="12.5" fill="#4A5560">把 10 秒的 MCP 调用变成后台跑几小时的异步作业，Windows 上无人值守</text><text x="18" y="347" font-size="12.5" fill="#4A5560">。</text><circle cx="22" cy="354" r="4.5" fill="#3178C6"/><text x="33" y="358" font-size="11.5" fill="#6E7781">TypeScript</text><text x="434" y="358" font-size="11.5" fill="#6E7781" text-anchor="end">★ 1</text></a><a href="https://github.com/awslew/codex-auto-resume-trio" target="_blank"><rect x="468.5" y="256.5" width="451" height="111" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="486" y="274" width="34" height="34" rx="8" fill="#0969DA" opacity="0.14"/><text x="503" y="296" font-size="13" font-weight="700" fill="#0969DA" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">CR</text><text x="532" y="289" font-size="15" font-weight="600" fill="#1F2328" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">codex-auto-resume-trio</text><text x="532" y="306" font-size="11.5" fill="#6E7781">Codex · 自动化</text><text x="486" y="330" font-size="12.5" fill="#4A5560">Codex 额度中断后自动续跑，附只读状态页与四家 API 配额托盘。</text><circle cx="490" cy="354" r="4.5" fill="#3178C6"/><text x="501" y="358" font-size="11.5" fill="#6E7781">TypeScript</text><text x="902" y="358" font-size="11.5" fill="#6E7781" text-anchor="end">★ 1</text></a></svg>
