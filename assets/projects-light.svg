<svg xmlns="http://www.w3.org/2000/svg" width="640" height="756" viewBox="0 0 640 756" role="img" aria-label="Selected open source projects" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif"><a href="https://github.com/awslew/continuity-orchestrator" target="_blank"><rect x="0.5" y="0.5" width="639" height="115" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="24" y="20" width="32" height="32" rx="8" fill="#0969DA" opacity="0.14"/><text x="40" y="41" font-size="12.5" font-weight="700" fill="#0969DA" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">CO</text><text x="68" y="33" font-size="15" font-weight="600" fill="#1F2328" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">continuity-orchestrator</text><text x="68" y="50" font-size="12" fill="#6E7781">Chat · 本地读改/额度接力</text><text x="24" y="76" font-size="13" fill="#4A5560">Pro：Chat 插件直接读改本机项目；Plus 目标：Codex 与网页 ChatGPT 接力（真实接力未验收）。</text><circle cx="28" cy="102" r="4.5" fill="#3178C6"/><text x="39" y="106" font-size="12" fill="#6E7781">TypeScript</text><text x="616" y="106" font-size="12" fill="#6E7781" text-anchor="end">★ 1</text></a><a href="https://github.com/awslew/codex-job-orchestrator" target="_blank"><rect x="0.5" y="128.5" width="639" height="115" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="24" y="148" width="32" height="32" rx="8" fill="#0969DA" opacity="0.14"/><text x="40" y="169" font-size="12.5" font-weight="700" fill="#0969DA" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">CJ</text><text x="68" y="161" font-size="15" font-weight="600" fill="#1F2328" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">codex-job-orchestrator</text><text x="68" y="178" font-size="12" fill="#6E7781">Codex · 任务分工省额度</text><text x="24" y="204" font-size="13" fill="#4A5560">主会话留额度做决策；简单执行与复杂推理按能力分给三条 agent 路径。</text><circle cx="28" cy="230" r="4.5" fill="#3178C6"/><text x="39" y="234" font-size="12" fill="#6E7781">TypeScript</text><text x="616" y="234" font-size="12" fill="#6E7781" text-anchor="end">★ 1</text></a><a href="https://github.com/awslew/codex-auto-resume-trio" target="_blank"><rect x="0.5" y="256.5" width="639" height="115" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="24" y="276" width="32" height="32" rx="8" fill="#0969DA" opacity="0.14"/><text x="40" y="297" font-size="12.5" font-weight="700" fill="#0969DA" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">CR</text><text x="68" y="289" font-size="15" font-weight="600" fill="#1F2328" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">codex-auto-resume-trio</text><text x="68" y="306" font-size="12" fill="#6E7781">Codex · 自动续跑</text><text x="24" y="332" font-size="13" fill="#4A5560">Codex 因额度停工？重置后自动续跑同一个会话，后台可查看状态。</text><circle cx="28" cy="358" r="4.5" fill="#3178C6"/><text x="39" y="362" font-size="12" fill="#6E7781">TypeScript</text><text x="616" y="362" font-size="12" fill="#6E7781" text-anchor="end">★ 1</text></a><a href="https://github.com/awslew/webgpt-drive" target="_blank"><rect x="0.5" y="384.5" width="639" height="115" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="24" y="404" width="32" height="32" rx="8" fill="#0969DA" opacity="0.14"/><text x="40" y="425" font-size="12.5" font-weight="700" fill="#0969DA" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">WG</text><text x="68" y="417" font-size="15" font-weight="600" fill="#1F2328" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">webgpt-drive</text><text x="68" y="434" font-size="12" fill="#6E7781">ChatGPT · 网页求助</text><text x="24" y="460" font-size="13" fill="#4A5560">本地 agent 遇到难题时，用已登录的 ChatGPT 网页版求助或生图，不另付 API 费。</text><circle cx="28" cy="486" r="4.5" fill="#F1E05A"/><text x="39" y="490" font-size="12" fill="#6E7781">JavaScript</text><text x="616" y="490" font-size="12" fill="#6E7781" text-anchor="end">★ 1</text></a><a href="https://github.com/awslew/ds-vision-kit" target="_blank"><rect x="0.5" y="512.5" width="639" height="115" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="24" y="532" width="32" height="32" rx="8" fill="#0969DA" opacity="0.14"/><text x="40" y="553" font-size="12.5" font-weight="700" fill="#0969DA" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">VK</text><text x="68" y="545" font-size="15" font-weight="600" fill="#1F2328" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">ds-vision-kit</text><text x="68" y="562" font-size="12" fill="#6E7781">Agent · 看懂图片</text><text x="24" y="588" font-size="13" fill="#4A5560">纯文本 agent 看不懂截图或图表？转成结构化文字，让原 agent 继续做事。</text><circle cx="28" cy="614" r="4.5" fill="#3572A5"/><text x="39" y="618" font-size="12" fill="#6E7781">Python</text><text x="616" y="618" font-size="12" fill="#6E7781" text-anchor="end">★ 1</text></a><a href="https://github.com/awslew/web-search-mcp" target="_blank"><rect x="0.5" y="640.5" width="639" height="115" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="24" y="660" width="32" height="32" rx="8" fill="#0969DA" opacity="0.14"/><text x="40" y="681" font-size="12.5" font-weight="700" fill="#0969DA" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">WS</text><text x="68" y="673" font-size="15" font-weight="600" fill="#1F2328" font-family="ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace">web-search-mcp</text><text x="68" y="690" font-size="12" fill="#6E7781">Agent · 联网找资料</text><text x="24" y="716" font-size="13" fill="#4A5560">agent 没有搜索 API key？多引擎查可靠资料并抽取可读正文。</text><circle cx="28" cy="742" r="4.5" fill="#F1E05A"/><text x="39" y="746" font-size="12" fill="#6E7781">JavaScript</text><text x="616" y="746" font-size="12" fill="#6E7781" text-anchor="end">★ 1</text></a></svg>
