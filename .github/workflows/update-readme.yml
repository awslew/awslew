name: Update profile README

# 每天重建一次 data.json 与 SVG 资产；手动也可以在 Actions 页触发。
on:
  schedule:
    - cron: '17 3 * * *' # UTC 03:17 = 北京时间 11:17
  workflow_dispatch:
  # 刻意不在 push 时触发：本 workflow 会回写 README/assets 并产生一次提交，
  # 若再被 push 触发就会形成「提交 → 触发 → 再提交」的循环，也会和本地推送打架。
  # 想立即刷新就手动跑：gh workflow run update-readme.yml

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 头像处理用标准库之外的东西，但只有 Pillow 一个依赖，装起来很快
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet --disable-pip-version-check pillow

      # 拉最新公开数据（仓库列表、贡献日历、提交数）
      - name: Fetch GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: awslew
        run: node scripts/fetch-data.mjs

      # 头像 → 88x88 圆形 PNG（hero.svg 会把它 base64 内嵌）
      - name: Prepare avatar
        run: python scripts/make-avatar.py

      # data.json → 自包含 SVG（深浅两套）
      - name: Build SVG assets
        run: node scripts/make-assets.mjs

      # data.json → README.md
      - name: Build README
        run: node scripts/build-readme.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md data.json assets/
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: refresh profile stats [skip ci]"
          git push
